<div class="container" style="padding: 20px; font-family: sans-serif;">
    <h2 style="margin-bottom: 20px; color: #333;">Notre Catalogue E-Commerce</h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
        <div *ngFor="let product of products"
            style="border: 1px solid #ddd; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <img [src]="product.imageUrl" alt="{{product.name}}" style="width: 100%; height: 200px; object-fit: cover;">

            <div style="padding: 15px;">
                <span
                    style="font-size: 12px; background: #e0f7fa; color: #006064; padding: 3px 8px; border-radius: 4px; font-weight: bold;">
                    {{ product.categoryName }}
                </span>
                <h3 style="margin: 10px 0 5px 0; font-size: 18px;">{{ product.name }}</h3>
                <p style="color: #666; font-size: 14px; height: 40px; overflow: hidden;">{{ product.description }}</p>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                    <span style="font-size: 20px; font-weight: bold; color: #2e7d32;">{{ product.price | currency:'EUR'
                        }}</span>
                    <button (click)="addToCart(product)"
                        style="background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
                        Ajouter au panier
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
